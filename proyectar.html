<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEAMLab · Sala química 360°</title><link rel="stylesheet" href="estilo.css"></head><body><div class="scene"><canvas id="cv"></canvas><div class="overlay"><b id="face"></b><small id="name"></small></div><div class="bottom" id="insight"></div><div class="projection-ui"><button onclick="document.documentElement.requestFullscreen?.()">Pantalla completa</button></div></div><script type="module">
import {MOLECULAS,CARAS,TITULOS} from './config.js';
const face=new URLSearchParams(location.search).get('cara');const cara=CARAS.includes(face)?face:'frente';const bc=new BroadcastChannel('steamlab-quimica-360-v1');let state=JSON.parse(localStorage.getItem('q360-state')||'{"mol":"agua","paused":false}');bc.onmessage=e=>state=e.data;window.addEventListener('storage',e=>{if(e.key==='q360-state'&&e.newValue)state=JSON.parse(e.newValue)});const cv=document.querySelector('#cv'),ctx=cv.getContext('2d');let phase=0,last=performance.now();function resize(){const r=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;}addEventListener('resize',resize);resize();
function spin([x,y,z],t){const a=t*.6,b=t*.43;const X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a);return [X,y*Math.cos(b)-Z*Math.sin(b),y*Math.sin(b)+Z*Math.cos(b)]}
function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!state.paused)phase+=dt;const m=MOLECULAS[state.mol]||MOLECULAS.agua,w=cv.width,h=cv.height,s=Math.min(w*.21,h*.24),t=phase+CARAS.indexOf(cara)*.3;const bg=ctx.createRadialGradient(w/2,h/2,4,w/2,h/2,Math.max(w,h)*.65);bg.addColorStop(0,'#184a6b');bg.addColorStop(1,'#020a17');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
const P=m.atomos.map(o=>{const [x,y,z]=spin(o.p,t),q=3.7/(3.7-z);return {x:w/2+x*s*q,y:h/2-y*s*q,z}});ctx.lineCap='round';m.enlaces.forEach(([i,j])=>{ctx.strokeStyle='#eaf7ff';ctx.lineWidth=Math.max(5,s*.05);ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()});const color={O:'#f77987',H:'#f6fbff',C:'#a0a7b3',N:'#869aff'};[...P.keys()].sort((a,b)=>P[a].z-P[b].z).forEach(i=>{const p=P[i],e=m.atomos[i].e,r=s*(e==='H'?.18:.27);const g=ctx.createRadialGradient(p.x-r*.3,p.y-r*.3,2,p.x,p.y,r);g.addColorStop(0,'white');g.addColorStop(.25,color[e]);g.addColorStop(1,'#17395b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.font=`bold ${Math.max(14,Math.round(r*.75))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#06172b';ctx.fillText(e,p.x,p.y)});
document.querySelector('#face').textContent=TITULOS[cara];document.querySelector('#name').textContent=`${m.nombre} (${m.formula}) · ${m.vsepr} · ${m.angulo}`;const msg={frente:`${m.nombre} · ${m.formula}`,derecha:'Compara los enlaces y dominios electrónicos',fondo:'Observa la simetría de la molécula',izquierda:`Polaridad resultante: ${m.polar}`,techo:'Visualiza la geometría espacial',piso:'Proyección plana del modelo · analiza su forma'};document.querySelector('#insight').textContent=msg[cara];requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
